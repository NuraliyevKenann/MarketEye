<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="1" stop-color="#070d1a"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5a4"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClip">
      <path d="M152 512 C 290 300, 734 300, 872 512 C 734 724, 290 724, 152 512 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <path d="M0 256H1024M0 384H1024M0 512H1024M0 640H1024M0 768H1024"/>
    <path d="M256 0V1024M384 0V1024M512 0V1024M640 0V1024M768 0V1024"/>
  </g>

  <!-- eye white area -->
  <path d="M152 512 C 290 300, 734 300, 872 512 C 734 724, 290 724, 152 512 Z" fill="#0b1628"/>

  <g clip-path="url(#eyeClip)">
    <!-- iris -->
    <circle cx="512" cy="512" r="168" fill="url(#iris)" filter="url(#glow)"/>
    <circle cx="512" cy="512" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
    <!-- pupil -->
    <circle cx="512" cy="512" r="96" fill="#07101f"/>
    <!-- rising chart inside pupil -->
    <polyline points="440,560 476,526 504,542 540,488 551,480"
              fill="none" stroke="#86efac" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="580,462 542,466 561,495" fill="#86efac" stroke="#86efac" stroke-width="6" stroke-linejoin="round"/>
    <!-- highlight -->
    <circle cx="470" cy="466" r="15" fill="#ffffff" fill-opacity="0.8"/>
  </g>

  <!-- eyelid outline -->
  <path d="M152 512 C 290 300, 734 300, 872 512 C 734 724, 290 724, 152 512 Z"
        fill="none" stroke="url(#lid)" stroke-width="30" stroke-linejoin="round" filter="url(#glow)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
